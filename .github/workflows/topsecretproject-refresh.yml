name: Refresh shelter breed-preview data

on:
  schedule:
    - cron: "23 * * * *"   # hourly check; the real work runs only when a new shelter list was uploaded
  workflow_dispatch: {}

concurrency:
  group: topsecretproject-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/pipeline/requirements.txt

      - name: Check for a new shelter list
        id: gate
        working-directory: .github/pipeline
        env:
          BLUEHOST_FTP_SERVER: ${{ secrets.BLUEHOST_FTP_SERVER }}
          BLUEHOST_FTP_USERNAME: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          BLUEHOST_FTP_PASSWORD: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          BLUEHOST_PRIVATE_DIR: ${{ secrets.BLUEHOST_PRIVATE_DIR }}
        run: python check_new_data.py

      - name: Install pipeline dependencies
        if: steps.gate.outputs.new == 'true'
        run: pip install -r .github/pipeline/requirements.txt

      - name: Create/verify private directory, deploy noindex + server config
        if: steps.gate.outputs.new == 'true'
        working-directory: .github/pipeline
        env:
          BLUEHOST_FTP_SERVER: ${{ secrets.BLUEHOST_FTP_SERVER }}
          BLUEHOST_FTP_USERNAME: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          BLUEHOST_FTP_PASSWORD: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          BLUEHOST_FTP_DIR: ${{ secrets.BLUEHOST_FTP_DIR }}
          BLUEHOST_PRIVATE_DIR: ${{ secrets.BLUEHOST_PRIVATE_DIR }}
          SMTP_HOST: ${{ secrets.BLUEHOST_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.BLUEHOST_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.BLUEHOST_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.BLUEHOST_SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python deploy_server_files.py

      - name: Run scrape + classify + publish
        if: steps.gate.outputs.new == 'true'
        working-directory: .github/pipeline
        env:
          BLUEHOST_FTP_SERVER: ${{ secrets.BLUEHOST_FTP_SERVER }}
          BLUEHOST_FTP_USERNAME: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          BLUEHOST_FTP_PASSWORD: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          BLUEHOST_FTP_DIR: ${{ secrets.BLUEHOST_FTP_DIR }}
          BLUEHOST_PRIVATE_DIR: ${{ secrets.BLUEHOST_PRIVATE_DIR }}
        run: python main.py
