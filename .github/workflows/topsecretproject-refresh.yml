name: Refresh shelter breed-preview data

on:
  schedule:
    - cron: "17 10 * * *"   # once daily; arbitrary off-the-hour minute to avoid GitHub's load spike at :00
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r .github/pipeline/requirements.txt

      - name: Run scrape + classify + publish
        working-directory: .github/pipeline
        env:
          BLUEHOST_FTP_SERVER: ${{ secrets.BLUEHOST_FTP_SERVER }}
          BLUEHOST_FTP_USERNAME: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          BLUEHOST_FTP_PASSWORD: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          BLUEHOST_FTP_DIR: ${{ secrets.BLUEHOST_FTP_DIR }}
          BLUEHOST_PRIVATE_DIR: ${{ secrets.BLUEHOST_PRIVATE_DIR }}
        run: python main.py

      - name: Generate and upload password gate
        working-directory: .github/pipeline
        env:
          BLUEHOST_FTP_SERVER: ${{ secrets.BLUEHOST_FTP_SERVER }}
          BLUEHOST_FTP_USERNAME: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          BLUEHOST_FTP_PASSWORD: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          BLUEHOST_FTP_DIR: ${{ secrets.BLUEHOST_FTP_DIR }}
          BLUEHOST_PRIVATE_DIR: ${{ secrets.BLUEHOST_PRIVATE_DIR }}
          BLUEHOST_PRIVATE_ABSOLUTE_PATH: ${{ secrets.BLUEHOST_PRIVATE_ABSOLUTE_PATH }}
          GATE_PASSWORD: ${{ secrets.TOPSECRETPROJECT_PASSWORD }}
          SMTP_HOST: ${{ secrets.BLUEHOST_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.BLUEHOST_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.BLUEHOST_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.BLUEHOST_SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python generate_password_gate.py
