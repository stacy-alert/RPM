name: Classifier smoke test (no CAC, no FTP, no secrets)

on:
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r .github/pipeline/requirements.txt

      - name: Classify a handful of random public dog photos
        working-directory: .github/pipeline
        run: python smoke_test_classifier.py
